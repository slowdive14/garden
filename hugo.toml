baseURL = "https://slowdive14.github.io/garden/"
languageCode = "ko-kr"
title = "잔향의 마음 로그(log)"
theme = "PaperMod"
publishDir = "public"
buildFuture = true
enableRobotsTXT = true

# 페이지네이션 설정 (최신 버전)
[pagination]
  pagerSize = 5

[params]
  env = "production"
  title = "잔향의 마음 로그(log)"
  description = "심리치료와 프로그래밍 공부한 내용을 포스팅합니다."
  author = "slowdive14"
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  # 본문 요약 표시 설정
  hideSummary = false
  summaryLength = 120  # 요약 길이 (약 2-3줄)
  truncate = true      # 요약 끝에 "..." 표시
  
[params.homeInfoParams]
  Title = "심리치료 + Programming"
  Content = "심리치료와 프로그래밍이 만나 새로운 무언가를 창조할 수 있길 바라는 잔향의 학습 공간입니다."

[params.label]
  text = "잔향의 마음 로그"
  # icon = "/apple-touch-icon.png"  # 필요시 아이콘 경로 지정
  # iconHeight = 35

# 소셜 아이콘 설정 (필요시 주석 해제 후 URL 변경)
# [[params.socialIcons]]
#   name = "github"
#   url = "https://github.com/slowdive14"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
    
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

[markup.highlight]
  noClasses = false