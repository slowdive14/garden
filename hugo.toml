baseURL = "https://slowdive14.github.io/garden/"
languageCode = "ko-kr"
title = "잔향의 마음 로그(log)"
theme = "PaperMod"
publishDir = "public"
buildFuture = true
enableRobotsTXT = true

[pagination]
  pagerSize = 5

[params]
  env = "production"
  title = "잔향의 마음 로그(log)"
  description = "심리치료와 프로그래밍 공부한 내용을 포스팅합니다."
  author = "slowdive14"
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  
  # 홈 페이지 설정
  mainSections = ["posts"]
  hideSummary = false
  summaryLength = 120
  truncate = true


  TocSide: 'left'  # TOC의 위치 (left 또는 right)
  
  # 다음 설정은 Hugo 내장 기능입니다
  tableOfContents:
    endLevel: 3    # TOC에 표시할 최대 헤딩 레벨 (기본값: 3)
    ordered: false # 순서 있는 목록 사용 여부
    startLevel: 2  # TOC에 표시할 최소 헤딩 레벨 (기본값: 2)

[params.label]
  text = "잔향의 마음 로그"

[menu]
  [[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 30

  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
    
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

[markup.highlight]
  noClasses = false


  