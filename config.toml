baseURL = "https://slowdive14.github.io/garden/"
languageCode = "ko-kr"
title = "잔향의 마음 로그(log)"
theme = "PaperMod"
publishDir = "public"
buildFuture = true
enableRobotsTXT = true

[pagination]
  pagerSize = 5

[params]
  env = "production"
  title = "잔향의 마음 로그(log)"
  description = "심리치료와 프로그래밍 공부한 내용을 포스팅합니다."
  author = "slowdive14"
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  
  # 홈 페이지에 포스트 목록만 보이도록 설정
  mainSections = ["posts"]
  hideSummary = false
  summaryLength = 120
  truncate = true
  
  # 홈 페이지 정보 섹션 완전히 비활성화
  profileMode = { enabled = false }
  
  # 특별한 첫 번째 포스트 비활성화
  disableSpecial1stPost = true

[params.label]
  text = "잔향의 마음 로그"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
    
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

[markup.highlight]
  noClasses = false
