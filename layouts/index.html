{{ define "main" }}
<main>
  <h1>{{ .Title }}</h1>
  <div>
    {{ .Content }}
  </div>
  <div>
    {{ range first 5 .Site.RegularPages }}
      <article>
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <div>{{ .Summary }}</div>
      </article>
    {{ end }}
  </div>
</main>
{{ end }}
